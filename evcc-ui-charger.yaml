# ─────────────────────────────────────────────────────────────────────────────
# evcc-ui-charger.yaml
#
# Paste this into the EVCC UI when adding a custom charger.
# (Devices → Chargers → Add → Custom)
#
# Do NOT include this file in evcc.yaml — it is for the UI config dialog only.
# Do NOT add a "title:" key or a "chargers:" wrapper; the UI handles those.
# ─────────────────────────────────────────────────────────────────────────────

status:
  source: http
  uri: http://localhost:7071/charger/status

enabled:
  source: http
  uri: http://localhost:7071/charger/enabled
  # Caches the schedule read EVCC makes every cycle (halves Rivian API load).
  # Keep it under 60s: EVCC re-checks charger state 60s after switching it.
  cache: 55s

# maxcurrent handles both reading and setting the charge current.
# Do NOT use setcurrent — it is not a valid key.
maxcurrent:
  source: http
  uri: http://localhost:7071/charger/current
  method: POST
  body: '{{.maxcurrent}}'

enable:
  source: http
  uri: http://localhost:7071/charger/enable
  method: POST
  body: '{{.enable}}'
