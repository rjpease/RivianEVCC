services:
  rivian_evcc_bridge:
    image: rivian_evcc_bridge
    build: .
    restart: unless-stopped
    ports:
      # Expose the bridge port so EVCC can reach it.
      # If EVCC runs in Docker on the same host, you can use the container
      # name instead of localhost — see README for details.
      - "7070:7070"
    volumes:
      - ./rivian_bridge/config.json:/app/config.json:ro
      - ./rivian_bridge/rivian-session.json:/app/rivian-session.json
    environment:
      - TZ=America/Los_Angeles   # adjust to your timezone
